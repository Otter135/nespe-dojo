rid;place-items:center;background:#2e4761;border-radius:8px;font-weight:800;font-size:13px}.choice.correct{background:#0d4137;border-color:#51d5ac}.choice.wrong{background:#4a262c;border-color:#eb8b98}.choice.correct .letter{background:#23715c}.choice.wrong .letter{background:#7d3d48}.input-row{display:flex;gap:8px}.input-row input{flex:1;min-width:0;background:#0c1a2a;border:1px solid #54708a;border-radius:10px;padding:13px;color:#fff;font-size:16px}.input-row button{flex:none}.exam-question{background:#0c1c2f;border:1px solid #355675;padding:17px 19px;border-radius:13px;line-height:2.0;white-space:pre-wrap;overflow-wrap:anywhere;font-size:15px}.blank{color:var(--yellow);background:#453a33;padding:2px 5px;border-radius:4px;font-weight:800}.result{border-radius:14px;padding:15px 17px;margin:17px 0 13px;border:1px solid #355875;background:#0c2536}.result.good{border-color:#358b72;background:#0d332f}.result.bad{border-color:#94515e;background:#34232f}.result b{font-size:17px}.source-panel{background:#0b1a2a;border:1px solid #3c5c78;border-radius:14px;padding:19px;margin:20px 0 0}.source-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.tag{display:inline-block;font-size:11px;padding:5px 8px;border-radius:7px;background:#153c3b;color:#9eefd3;font-weight:800}.explain{background:#162d3e;padding:13px 15px;border-radius:10px;line-height:1.85;margin-top:14px;color:#e9f1f8;font-size:14px}.links{display:flex;flex-wrap:wrap;gap:9px;margin-top:17px}.linkbtn{display:inline-flex;align-items:center;border:1px solid #527690;border-radius:9px;padding:9px 12px;font-size:13px;color:#addefc;background:#142a3f}.warn{color:var(--yellow)}.bottom{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap;margin-top:20px}.hidden{display:none!important}.fav{font-size:13px;cursor:pointer;color:var(--yellow);border:1px solid #53677f;border-radius:9px;background:#19293e;padding:8px 11px}.finish{text-align:center;padding:25px 10px}.finish .big{font-size:60px;font-weight:900;line-height:1.4}.q-meta{font-size:12px;color:#aec5db;margin:0 0 12px}.bar{height:9px;background:#293c4d;border-radius:99px;overflow:hidden;margin:8px 0 16px}.bar i{display:block;background:var(--mint);height:100%}.fine{font-size:12px;color:#8ea8c0;line-height:1.9;margin-top:15px}.divider{border:0;border-top:1px solid #364d60;margin:18px 0}.badgetext{font-size:12px;line-height:1.8;color:#bcd0df}.no-data{font-size:14px;color:var(--yellow);padding:12px 0}.no-data .btn{margin-top:8px}.actionbar{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}@media(max-width:620px){.wrap{padding:13px 13px 80px}.card{padding:17px;border-radius:14px}.grid{grid-template-columns:1fr;gap:12px}.stats{gap:7px}.stat{padding:12px}.stat .num{font-size:24px}.stat .desc{font-size:11px}.choice{font-size:14px;padding:13px 12px}.brand{font-size:14px}.source-panel{padding:14px}.input-row{flex-direction:column}.input-row .btn{width:100%}.btn.full{margin-top:14px}.bottom .btn{flex:1}.links .linkbtn{width:100%;justify-content:center}}

'use strict';
const QUESTIONS=[{"id":"2021-I-問2-a","year":2021,"section":"I","source":"問2 設問1","slot":"a","term":"共有鍵","category":"セキュリティ","description":"通信する双方が同じ秘密の鍵を保持して利用する方式で、IPsecの機器認証にも用いられる。","explanation":"共有鍵方式では鍵を安全に事前共有する必要がある。証明書方式との違いを押さえよう。","page":10,"context":"IPsec VPNの接続機器同士には、認証用の事前［a］を設定する。","hint":"IPsec認証で両端にあらかじめ設定する同じ秘密情報。","problem":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000d5ru-att/2021r03h_nw_pm1_qs.pdf#page=11","answer":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000d5ru-att/2021r03h_nw_pm1_ans.pdf"},{"id":"2021-I-問2-c","year":2021,"section":"I","source":"問2 設問1","slot":"c","term":"コスト","category":"ルーティング","description":"OSPFで経路の優劣を決めるため、リンクごとに設定・算出する尺度。","explanation":"OSPFは経路のコストの合計が最小となる経路を優先する。","page":10,"context":"OSPFのType1 LSAに格納されるリンクのメトリック値を［c］と呼ぶ。","hint":"リンクの経路選択に用いる重み。","problem":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000d5ru-att/2021r03h_nw_pm1_qs.pdf#page=11","answer":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000d5ru-att/2021r03h_nw_pm1_ans.pdf"},{"id":"2021-I-問2-d","year":2021,"section":"I","source":"問2 設問1","slot":"d","term":"ダイクストラ","category":"ルーティング","description":"OSPFがリンク状態データベースから最短経路を計算する際に使用するアルゴリズム。","explanation":"SPFアルゴリズムとも呼ばれ、リンク状態型ルーティングの基本。","page":10,"context":"OSPFでリンク状態情報から最短経路を求める際、［d］アルゴリズムを使う。","hint":"リンク状態型のSPF計算。","problem":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000d5ru-att/2021r03h_nw_pm1_qs.pdf#page=11","answer":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000d5ru-att/2021r03h_nw_pm1_ans.pdf"},{"id":"2021-I-問3-b","year":2021,"section":"I","source":"問3 設問1","slot":"b","term":"UDP","category":"トランスポート","description":"接続確立を行わずにデータグラムを送る、低オーバーヘッドのトランスポート層プロトコル。","explanation":"音声など低遅延が求められる用途でもよく使う。到達保証は標準ではない。","page":16,"context":"音声をパケット化した際のヘッダーは、IP・［b］・RTPなどで構成される。","hint":"VoIPでRTPの下位に利用するトランスポート層プロトコル。","problem":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000d5ru-att/2021r03h_nw_pm1_qs.pdf#page=17","answer":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000d5ru-att/2021r03h_nw_pm1_ans.pdf"},{"id":"2021-I-問3-d","year":2021,"section":"I","source":"問3 設問1","slot":"d","term":"ToS","category":"QoS","description":"IPv4ヘッダー内にある、通信品質の扱いに関連するフィールドの呼称。","explanation":"旧来のToSフィールドは現在DSフィールドとして利用され、DSCPなどに使われる。","page":17,"context":"QoSのDSCPによるマーキングは、IPヘッダーの［d］フィールドを再定義して使う。","hint":"IPv4ヘッダーに元から存在するサービス種別のフィールド。","problem":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000d5ru-att/2021r03h_nw_pm1_qs.pdf#page=18","answer":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000d5ru-att/2021r03h_nw_pm1_ans.pdf"},{"id":"2021-I-問1-b","year":2021,"section":"I","source":"問1 設問3","slot":"b","term":"SNMP","category":"監視・運用","description":"ネットワーク機器の状態や統計情報の取得・監視に利用する管理プロトコル。","explanation":"マネージャとエージェントがMIBの管理情報を扱う。","page":5,"context":"運用管理サーバがL2SWなどからLLDP-MIBを取得するとき、［b］を利用する。","hint":"MIBの情報を取得するネットワーク管理プロトコル。","problem":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000d5ru-att/2021r03h_nw_pm1_qs.pdf#page=6","answer":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000d5ru-att/2021r03h_nw_pm1_ans.pdf"},{"id":"2021-II-問1-a","year":2021,"section":"II","source":"問1 設問1","slot":"a","term":"フォワーダ","category":"Web・DNS","description":"DNSサーバが自分で解決しない名前解決要求を、別のDNSサーバへ転送する機能を表す語。","explanation":"当該過去問ではDNSフォワーダとして登場した。STPのフォワーディングとは異なる。","page":3,"context":"内部DNSサーバはDNS［a］として動作し、社外ドメインの照会をISPのフルサービスリゾルバに転送する。","hint":"DNSの問い合わせを他のリゾルバに引き渡す機能。","problem":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000d5ru-att/2021r03h_nw_pm2_qs.pdf#page=4","answer":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000d5ru-att/2021r03h_nw_pm2_ans.pdf"},{"id":"2021-II-問1-b","year":2021,"section":"II","source":"問1 設問1","slot":"b","term":"プライオリティ値","category":"ルーティング","description":"VRRPで、複数のルータのうちどれをマスタールータとするかを決める優先度の値。","explanation":"この過去問では値を大きく設定したL3SWをVRRPマスターにしていた。STPの優先度とは別の文脈。","page":3,"context":"L3SW1のVRRPの［b］を大きく設定し、マスタルータにしている。","hint":"VRRPのマスタ選出で比較する値。","problem":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000d5ru-att/2021r03h_nw_pm2_qs.pdf#page=4","answer":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000d5ru-att/2021r03h_nw_pm2_ans.pdf"},{"id":"2021-II-問1-c","year":2021,"section":"II","source":"問1 設問2","slot":"c","term":"指定","category":"L2・スイッチ","description":"STPで各セグメントからルートブリッジに向かう最良経路のポートとして選ばれ、転送を担当するポートの役割を表す語。","explanation":"指定ポートはセグメント単位で選出される。","page":5,"context":"STPでルートブリッジの全ポートは［c］ポートとなる。","hint":"ルートブリッジから各セグメントへの転送を担うポート。","problem":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000d5ru-att/2021r03h_nw_pm2_qs.pdf#page=6","answer":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000d5ru-att/2021r03h_nw_pm2_ans.pdf"},{"id":"2021-II-問1-d","year":2021,"section":"II","source":"問1 設問2","slot":"d","term":"非指定","category":"L2・スイッチ","description":"従来のSTPにおいてループ回避のため転送を行わないポートの役割を表す語。","explanation":"RSTPでの代替ポートなどと対応付けて学ぼう。","page":5,"context":"STPで非ルートブリッジの一部ポートは、経路選択の結果［d］ポートとなる。","hint":"ループ防止のため通常フレーム転送しないポートの分類。","problem":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000d5ru-att/2021r03h_nw_pm2_qs.pdf#page=6","answer":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000d5ru-att/2021r03h_nw_pm2_ans.pdf"},{"id":"2021-II-問1-e","year":2021,"section":"II","source":"問1 設問2","slot":"e","term":"MACアドレス","category":"L2・スイッチ","description":"Ethernetインタフェースに付くリンク層の識別子で、ブリッジIDの比較にも用いられる。","explanation":"通常48ビットのアドレスであり、IPアドレスとは層が異なる。","page":5,"context":"STPでトポロジ変更の際、スイッチは［e］テーブルをクリアする。","hint":"学習した宛先とポートの対応を保持するテーブル。","problem":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000d5ru-att/2021r03h_nw_pm2_qs.pdf#page=6","answer":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000d5ru-att/2021r03h_nw_pm2_ans.pdf"},{"id":"2021-II-問2-キ","year":2021,"section":"II","source":"問2 設問2","slot":"キ","term":"キープアライブ","category":"ルーティング","description":"BGPなどで隣接機器との接続が生存していることを確認するために定期送信するメッセージ。","explanation":"BGPではKEEPALIVEメッセージを使う。","page":20,"context":"BGPでは［キ］メッセージを定期送信し、受信できなくなるとピアリングを切断する。","hint":"BGPピアの生存 9lh8-att/2025r07h_nw_pm2_qs.pdf#page=18","answer":"https://www.ipa.go.jp/shiken/mondai-kaiotu/nl10bi0000009lh8-att/2025r07h_nw_pm2_ans.pdf"},{"id":"2025-II-問2-l","year":2025,"section":"II","source":"問2 設問3","slot":"l","term":"トランスポート","category":"トランスポート","description":"OSI参照モデル第4層で、エンドツーエンドのデータ転送を担うレイヤーの名称。","explanation":"TCPやUDPが代表例。","page":18,"context":"CoAPはUDPを前提とする［l］層のプロトコルを使用する。","hint":"UDPが属するOSI参照モデルの層。","problem":"https://www.ipa.go.jp/shiken/mondai-kaiotu/nl10bi0000009lh8-att/2025r07h_nw_pm2_qs.pdf#page=19","answer":"https://www.ipa.go.jp/shiken/mondai-kaiotu/nl10bi0000009lh8-att/2025r07h_nw_pm2_ans.pdf"},{"id":"2025-II-問2-n","year":2025,"section":"II","source":"問2 設問3","slot":"n","term":"重複","category":"トランスポート","description":"通信の再送等で同じメッセージを二度受信する状態。","explanation":"CoAPではメッセージIDなどによる重複検出が重要。","page":18,"context":"CoAPでは、パケットが［n］して届くことをメッセージIDなどで検出できる。","hint":"同じものが複数届く現象。","problem":"https://www.ipa.go.jp/shiken/mondai-kaiotu/nl10bi0000009lh8-att/2025r07h_nw_pm2_qs.pdf#page=19","answer":"https://www.ipa.go.jp/shiken/mondai-kaiotu/nl10bi0000009lh8-att/2025r07h_nw_pm2_ans.pdf"},{"id":"2025-II-問2-p","year":2025,"section":"II","source":"問2 設問3","slot":"p","term":"バックオフ","category":"トランスポート","description":"再送の衝突や過負荷を避けるため、待機時間を調整してから再試行する仕組み。","explanation":"指数バックオフなどの方式がある。","page":19,"context":"CoAPの再送間隔は指数［p］方式で算出する。","hint":"再送待機時間を段階的に長くする方法。","problem":"https://www.ipa.go.jp/shiken/mondai-kaiotu/nl10bi0000009lh8-att/2025r07h_nw_pm2_qs.pdf#page=20","answer":"https://www.ipa.go.jp/shiken/mondai-kaiotu/nl10bi0000009lh8-att/2025r07h_nw_pm2_ans.pdf"}];
const KEY='nespe_ipa_verified_v1';
let store={answers:{},favorites:{}};
try{const raw=localStorage.getItem(KEY);if(raw){const val=JSON.parse(raw);if(val&&typeof val==='object')store={answers:val.answers||{},favorites:val.favorites||{}}}}catch(e){}
const state={screen:'home',filters:{year:'all',section:'all',category:'all',count:'20',mode:'choice',scope:'all'},session:[],idx:0,answered:false,selection:-1,typed:'',lastCorrect:null,options:[],wrongSession:[],correctSession:0,error:''};
const app=document.getElementById('app');
function esc(s){return String(s??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#39;')}
function randomize(xs){let a=[...xs];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function save(){try{localStorage.setItem(KEY,JSON.stringify(store))}catch(e){}}
function totals(){const rows=Object.values(store.answers);return {done:rows.length,correct:rows.reduce((s,x)=>s+(x.good||0),0),attempts:rows.reduce((s,x)=>s+(x.total||0),0),review:rows.filter(x=>x.needsReview).length}}
function statLines(){let t=totals();return `<div class="stats"><div class="stat"><div class="num">${QUESTIONS.length}</div><div class="desc">公式照合した用語</div></div><div class="stat"><div class="num">${t.done}</div><div class="desc">学習済み用語</div></div><div class="stat"><div class="num">${t.review}</div><div class="desc">復習待ち</div></div></div>`}
function home(){state.screen='home';state.error='';render()}
function renderHome(){let years=[...new Set(QUESTIONS.map(x=>x.year))].sort();let cats=[...new Set(QUESTIONS.map(x=>x.category))].sort();let f=state.filters;
const select=(id,label,values)=>`<div class="field"><label for="${id}">${label}</label><select id="${id}" data-filter="${id}">${values.map(([v,t])=>`<option value="${esc(v)}" ${f[id]===String(v)?'selected':''}>${esc(t)}</option>`).join('')}</select></div>`;
const radio=(id,items)=>`<div class="field"><span class="label">${id==='mode'?'出題形式':'対象'}</span><div class="radio-line">${items.map(([val,txt])=>`<button class="pill ${f[id]===val?'selected':''}" type="button" data-pill="${id}" data-value="${val}">${txt}</button>`).join('')}</div></div>`;
app.innerHTML=`<section class="hero"><div class="eyebrow">IPA NETWORK SPECIALIST · AFTERNOON</div><h1>用語を知る。<br>文脈から、答えを導く。</h1><p class="sub">ネットワークスペシャリスト試験の午後Ⅰ・Ⅱで実際に空欄の答えとして登場した用語を、4択と記述で反復。解答後に<strong>元の出題文脈・根拠・公式PDF</strong>を確認できます。</p></section>${statLines()}
<section class="card"><h2>出題条件</h2><div class="grid">${select('year','出題年度',[['all','すべての年度'],...years.map(x=>[String(x),`${x}年（令和${x-2018}年）`])])}${select('section','試験区分',[['all','午後Ⅰ・午後Ⅱ'],['I','午後Ⅰ'],['II','午後Ⅱ']])}${select('category','分野',[['all','すべての分野'],...cats.map(x=>[x,x])])}${select('count','問題数',[['10','10問'],['20','20問'],['50','50問'],['all','対象をすべて']])}</div><div class="divider"></div><div class="grid">${radio('mode',[['choice','4択（用語 → 説明）'],['write','記述（文脈 → 用語）']])}${radio('scope',[['all','すべて'],['wrong','間違えた問題'],['fav','お気に入り']])}</div><button id="start" class="btn full">この条件で出題する →</button><div id="home-error" class="no-data">${esc(state.error)}</div></section>
<section class="card"><h3>収録データについて</h3><p class="badgetext">対象：令和3〜7年春期の午後Ⅰ・午後Ⅱ。以前の104件を見直し、空欄と解答の対応が一致しない・確認できない5件を除外しました。<strong>99件は旧版から検証した対象で、過去5年のすべての空欄を網羅した数ではありません。</strong></p><p class="badgetext">解説に載せる空欄文は、IPA公式の出題箇所を短く言い換えた<strong>学習用再構成</strong>です。原文そのままの引用ではありません。必ず公式問題PDFに直接移動できます。</p><div class="actionbar"><button class="btn secondary" id="export">成績をJSON保存</button><button class="btn ghost" id="reset-data">学習履歴をリセット</button></div></section>`;
app.querySelectorAll('[data-filter]').forEach(el=>el.addEventListener('change',()=>{state.filters[el.dataset.filter]=el.value;state.error='';renderHome()}));
app.querySelectorAll('[data-pill]').forEach(el=>el.addEventListener('click',()=>{state.filters[el.dataset.pill]=el.dataset.value;state.error='';renderHome()}));
app.querySelector('#start').addEventListener('click',start);
app.querySelector('#export').addEventListener('click',exportResults);
app.querySelector('#reset-data').addEventListener('click',()=>{if(confirm('保存した学習成績とお気に入りをすべて削除しますか？')){store={answers:{},favorites:{}};save();renderHome()}})
}
function pool(){let f=state.filters;return QUESTIONS.filter(q=>(f.year==='all'||q.year===Number(f.year))&&(f.section==='all'||q.section===f.section)&&(f.category==='all'||q.category===f.category)&&(f.scope==='all'||(f.scope==='wrong'?store.answers[q.id]?.needsReview:store.favorites[q.id])))}
function createOptions(q){let same=QUESTIONS.filter(x=>x.id!==q.id&&x.term!==q.term&&x.description!==q.description&&x.category===q.category);let other=QUESTIONS.filter(x=>x.id!==q.id&&x.term!==q.term&&x.description!==q.description&&x.category!==q.category);let selected=randomize(same).slice(0,3);if(selected.length<3) selected.push(...randomize(other).slice(0,3-selected.length));return randomize([{text:q.description,id:q.id},...selected.map(x=>({text:x.description,id:x.id}))])}
function start(){let arr=randomize(pool());if(!arr.length){state.error='条件に一致する問題がありません。年度・分野・「すべて」を変更してね。';renderHome();return}let max=state.filters.count==='all'?arr.length:Number(state.filters.count);state.session=arr.slice(0,max);state.idx=0;state.correctSession=0;state.wrongSession=[];state.screen='quiz';resetQuestion();renderQuiz();window.scrollTo(0,0)}
function resetQuestion(){state.answered=false;state.selection=-1;state.typed='';state.lastCorrect=null;state.options=createOptions(state.session[state.idx])}
function normalize(s){return String(s??'').trim().normalize('NFKC').replace(/[\s 　・－ー‐‑–—-]/g,'').toLowerCase()}
function mark(ok){if(state.answered)return;let q=state.session[state.idx];state.answered=true;state.lastCorrect=ok;if(ok)state.correctSession++;else state.wrongSession.push(q.id);let st=store.answers[q.id]||{total:0,good:0,needsReview:false};st.total++;if(ok){st.good++;st.needsReview=false}else st.needsReview=true;store.answers[q.id]=st;save();renderQuiz()}
function answerChoice(i){if(state.answered)return;state.selection=i;mark(state.options[i].id===state.session[state.idx].id)}
function answerText(){if(state.answered)return;let el=app.querySelector('#written-answer');if(!el)return;state.typed=el.value;if(!state.typed.trim())return;mark(normalize(state.typed)===normalize(state.session[state.idx].term))}
function next(){if(!state.answered)return;if(state.idx+1>=state.session.length){state.screen='done';renderDone()}else{state.idx++;resetQuestion();renderQuiz()}window.scrollTo(0,0)}
function highlightedContext(s){return esc(s).replace(/［[^］]+］/g,x=>`<span class="blank">${x}</span>`)}
function renderQuiz(){let q=state.session[state.idx];let done=state.answered;let isWrite=state.filters.mode==='write';let wrongLabel=done? (state.lastCorrect?'正解！':'不正解。正解を確認しよう') : '';
let choices=state.options.map((opt,i)=>{let cls=done?(opt.id===q.id?'correct':(i===state.selection?'wrong':'')):'';return `<button class="choice ${cls}" type="button" data-choice="${i}" ${done?'disabled':''}><span class="letter">${String.fromCharCode(65+i)}</span><span>${esc(opt.text)}</span></button>`}).join('');
app.innerHTML=`<div class="qtop"><span>問題 ${state.idx+1} / ${state.session.length}</span><span>この回の正解 ${state.correctSession}問</span></div><div class="progress"><i style="width:${Math.round((state.idx+(done?1:0))/state.session.length*100)}%"></i></div><section class="card"><div class="qtop"><span>${q.year}年春期・午後${q.section==='I'?'Ⅰ':'Ⅱ'}・${esc(q.source)} ／ 空欄 ${esc(q.slot)}</span><button class="fav" id="favorite">${store.favorites[q.id]?'★ お気に入り登録済':'☆ お気に入りに追加'}</button></div>
${isWrite?`<div class="eyebrow" style="margin-top:16px">記述モード</div><h2 style="margin-top:10px">空欄に入る用語を答えよう</h2><div class="exam-question">${highlightedContext(q.context)}</div><p class="mini">学習用に要約した空欄文です。原文全文ではありません。</p>${!done?`<div class="input-row"><input id="written-answer" type="text" placeholder="答えの用語を入力" autocomplete="off" spellcheck="false"><button class="btn" id="submit-write">解答する</button></div>`:''}`
:`<div class="eyebrow" style="margin-top:16px">4択モード</div><div class="term">${esc(q.term)}</div><p class="instructions">この用語について、正しい説明はどれ？</p><div class="choices">${choices}</div>`}
${done?`<div class="result ${state.lastCorrect?'good':'bad'}"><b>${state.lastCorrect?'✓ ':'✕ '}${wrongLabel}</b><p style="margin:7px 0 0">正解：<strong>${esc(q.term)}</strong>${isWrite?`<span class="muted"> ／ あなたの回答：${esc(state.typed)}</span>`:''}</p><p class="mini">${esc(q.explanation)}</p></div><section class="source-panel"><div class="source-head"><h3>実際の過去問ではどう問われた？</h3><span class="tag">IPA公式・問題文と解答例を照合</span></div><div class="q-meta">${q.year}年（令和${q.year-2018}年）春期　午後${q.section==='I'?'Ⅰ':'Ⅱ'}　${esc(q.source)}　空欄［${esc(q.slot)}］ ／ 問題冊子 p.${q.page}</div><div class="exam-question">${highlightedContext(q.context)}</div><p class="fine" style="margin:7px 0 0">※元の出題箇所を短く言い換えた学習用再構成。引用・原文そのままではありません。</p><div class="explain"><strong style="color:var(--mint)">ここが解答の決め手</strong><div>${esc(q.hint)}</div></div><div class="links"><a class="linkbtn" href="${esc(q.problem)}" target="_blank" rel="noopener noreferrer">IPA公式の問題冊子（該当ページ） ↗</a><a class="linkbtn" href="${esc(q.answer)}" target="_blank" rel="noopener noreferrer">IPA公式の解答例 ↗</a></div></section>`:''}
<div class="bottom"><button class="btn ghost" id="exit">← 出題条件へ</button>${done?`<button class="btn" id="next">${state.idx+1===state.session.length?'結果を見る':'次の問題へ →'}</button>`:''}</div></section>`;
app.querySelector('#favorite').addEventListener('click',()=>{store.favorites[q.id]=!store.favorites[q.id];save();renderQuiz()});app.querySelector('#exit').addEventListener('click',home);
if(!done){if(isWrite){app.querySelector('#submit-write').addEventListener('click',answerText);app.querySelector('#written-answer').addEventListener('keydown',e=>{if(e.key==='Enter')answerText()});app.querySelector('#written-answer').focus()}else app.querySelectorAll('[data-choice]').forEach(el=>el.addEventListener('click',()=>answerChoice(Number(el.dataset.choice))))}else app.querySelector('#next').addEventListener('click',next);
}
function renderDone(){let n=state.session.length,correct=state.correctSession,pct=Math.round(correct/n*100);app.innerHTML=`<section class="card finish"><div class="eyebrow">演習完了</div><h1>お疲れさま！</h1><div class="big">${correct}<span class="muted" style="font-size:26px"> / ${n}問</span></div><div style="font-size:20px;color:var(--mint);font-weight:800">正答率 ${pct}%</div><div class="bar"><i style="width:${pct}%"></i></div><p class="muted">${state.wrongSession.length?`間違えた${state.wrongSession.length}問は「復習待ち」に登録しました。次は間違えた問題だけを選んで解こう。`:'今回の問題はすべて正解！記述式にも挑戦してみよう。'}</p><div class="bottom"><button class="btn ghost" id="return-home">出題条件に戻る</button><button class="btn" id="retry">同じ条件でもう一度</button></div></section>`;app.querySelector('#return-home').addEventListener('click',home);app.querySelector('#retry').addEventListener('click',start)}
function exportResults(){let text=JSON.stringify({application:'ネスペ午後 用語道場',version:'official-verified-v1',exported:new Date().toISOString(),results:store},null,2);let blob=new Blob([text],{type:'application/json'});let url=URL.createObjectURL(blob);let a=document.createElement('a');a.href=url;a.download='nespe-results-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)}
function render(){if(state.screen==='home')renderHome();else if(state.screen==='quiz')renderQuiz();else renderDone()}
render();
</script>
</body></html>
